# Safety reference. deploy.mjs renders immutable image and service name to JSON
# (valid YAML) before gcloud run services replace.
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: yt-subtitle-po-token
  annotations:
    run.googleapis.com/minScale: '0'
    run.googleapis.com/maxScale: '1'
    run.googleapis.com/invoker-iam-disabled: 'false'
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: '0'
        autoscaling.knative.dev/maxScale: '1'
        run.googleapis.com/cpu-throttling: 'true'
        run.googleapis.com/startup-cpu-boost: 'false'
    spec:
      containerConcurrency: 1
      timeoutSeconds: 30
      containers:
        - image: IMMUTABLE_IMAGE_DIGEST_REQUIRED
          resources:
            limits: { cpu: '1', memory: 512Mi }
