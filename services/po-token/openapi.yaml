openapi: 3.1.0
info:
  title: AI Lyrics PO Token
  version: 1.0.0
paths:
  /healthz:
    get:
      responses:
        '200':
          description: Process is alive; no upstream calls
  /v1/po-token:
    post:
      security: [{ googleIdentity: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [videoId]
              properties:
                videoId: { type: string, pattern: '^[A-Za-z0-9_-]{11}$' }
      responses:
        '200':
          description: Video-bound token; Cache-Control no-store
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [videoId, poToken, expiresAt]
                properties:
                  videoId: { type: string }
                  poToken: { type: string, maxLength: 4096, pattern: '^[A-Za-z0-9_-]+={0,2}$' }
                  expiresAt: { type: string, format: date-time }
        default:
          description: Redacted error with error.code and error.message
components:
  securitySchemes:
    googleIdentity: { type: http, scheme: bearer, bearerFormat: Google identity token }
